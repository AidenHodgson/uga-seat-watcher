<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seat Watcher</title>
<style>
:root{
  --bg:#14161a;--panel:#1c1f25;--panel2:#23272f;--line:#2e333d;--text:#eef0f3;--soft:#c3c8d1;--quiet:#8b929e;--faint:#5d6470;
  --red:#ba0c2f;--green:#5fd08a;--amber:#f2b84b;--blue:#6aa7ff;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--blue)}
header{position:sticky;top:0;z-index:5;background:rgba(20,22,26,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top{max-width:1100px;margin:0 auto;padding:14px 20px 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:700;font-size:20px;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--red);display:inline-block}
.sub{color:var(--quiet);font-size:13px}
.spacer{flex:1}
.tabs{max-width:1100px;margin:0 auto;padding:10px 20px 0;display:flex;gap:4px}
.tab{background:none;border:0;color:var(--quiet);font:600 14px inherit;padding:10px 14px;border-bottom:2px solid transparent;cursor:pointer}
.tab.on{color:var(--text);border-color:var(--red)}
main{max-width:1100px;margin:0 auto;padding:20px 20px 80px}
button.btn{background:var(--red);color:#fff;border:0;border-radius:999px;padding:9px 16px;font:600 14px inherit;cursor:pointer}
button.btn.alt{background:var(--panel2);color:var(--text)}
button.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.card h2{margin:0;font-size:17px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card h2 small{color:var(--quiet);font-weight:400;font-size:13px}
.row{display:grid;grid-template-columns:240px 1fr 120px 150px;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;margin-top:6px;border-left:3px solid transparent;background:var(--panel2)}
.row.full{opacity:.38;background:transparent}
.row.fit{border-left-color:var(--green)}
.row.nofit{border-left-color:var(--amber)}
.when{font-weight:600}
.who{color:var(--soft);font-size:14px}
.who a{color:var(--soft);text-decoration:none;border-bottom:1px dotted var(--faint)}
.who a:hover{color:var(--text)}
.crn{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--soft);cursor:pointer;font-size:13px}
.crn:hover{color:var(--text)}
.seats{text-align:right;font-weight:700}
.seats.open{color:var(--green)}.seats.none{color:var(--quiet)}
.seats small{display:block;font-weight:400;color:var(--quiet);font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.chip{font-size:11.5px;border-radius:999px;padding:2px 8px;background:#2d2a20;color:var(--amber)}
.chip.ok{background:#1d2e24;color:var(--green)}
.chip.star{background:#1f2a3d;color:var(--blue)}
.star{background:none;border:0;color:var(--faint);font-size:18px;cursor:pointer;padding:0 4px}
.star.on{color:var(--blue)}
.note{color:var(--quiet);font-size:13px;margin:6px 0 0}
.banner{background:#2d2a20;color:var(--amber);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.banner.ok{background:#1d2e24;color:var(--green)}
.event{padding:8px 0;border-top:1px solid var(--line)}.event:first-child{border-top:0}
.event b{display:block}.event span{color:var(--quiet);font-size:13px;white-space:pre-line}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
label.check{display:flex;gap:8px;align-items:center;color:var(--soft);cursor:pointer}
.grid{display:grid;grid-template-columns:44px repeat(5,1fr);margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
.grid .h{background:var(--panel2);text-align:center;font-size:12px;color:var(--quiet);padding:6px 0;font-weight:600}
.col{position:relative;border-left:1px solid var(--line)}
.hours{position:relative}
.hr{position:absolute;left:0;right:0;border-top:1px dashed #262a32;font-size:10px;color:var(--faint);padding-left:4px}
.block{position:absolute;left:3px;right:3px;border-radius:8px;padding:3px 6px;font-size:11.5px;line-height:1.25;overflow:hidden;color:#0d0f12;font-weight:600}
.block span{display:block;font-weight:400;opacity:.85}
.picks{margin-top:10px;display:grid;gap:6px}
.pick{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:14px}
.pick b{min-width:92px}
.pick .alts{color:var(--quiet);font-size:13px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.field{margin-bottom:16px}
label.l{display:block;font-weight:600;margin-bottom:6px}
.hint{color:var(--quiet);font-size:13px;margin-top:4px}
input[type=text],input[type=number],select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:15px inherit;width:100%;max-width:360px}
.days{display:flex;gap:6px}
.day{border:1px solid var(--line);background:var(--panel2);color:var(--quiet);border-radius:10px;padding:7px 11px;cursor:pointer;font-weight:600;user-select:none}
.day.on{background:#3a1820;border-color:var(--red);color:#fff}
.course{display:grid;grid-template-columns:120px 1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.course:first-child{border-top:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.row{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.course{grid-template-columns:1fr 1fr}}
.wiz{max-width:640px;margin:30px auto}
.wiz h1{font-size:28px;margin:0 0 6px}
.wiz .lead{color:var(--soft);margin:0 0 22px}
.steps{display:flex;gap:6px;margin-bottom:18px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--red)}
.opt{display:block;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.opt.on{border-color:var(--red);background:#2a1a1f}
.added{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);border-radius:12px;padding:10px 14px;margin-top:8px}
.added small{color:var(--quiet)}
.nav{display:flex;justify-content:space-between;margin-top:22px}
.err{color:#ff8a8a;margin-top:8px}
.big{font-size:18px;font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--panel2);padding:10px 14px;border-radius:10px;display:inline-block;margin:6px 0;user-select:all}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:999px;display:none}
.presets{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.preset{border:1px solid var(--line);background:var(--panel2);color:var(--soft);border-radius:999px;padding:6px 12px;cursor:pointer;font:600 13px inherit;user-select:none}
.preset.on{background:#3a1820;border-color:var(--red);color:#fff}
.preset.on::before{content:"\2713  "}
.move{background:var(--panel2);border-radius:12px;padding:12px 14px;margin-top:10px;border-left:3px solid var(--blue)}
.move.k0{border-left-color:var(--green)}.move.k2{border-left-color:var(--faint)}
.move b{display:block;font-size:15px}
.move p{margin:4px 0 0;color:var(--soft);font-size:14px}
.move ol{margin:8px 0 0;padding-left:20px;color:var(--soft);font-size:13.5px}
.move ol li{margin:2px 0}
.datechips{display:flex;gap:8px;flex-wrap:wrap}
.date{background:var(--panel2);border-radius:12px;padding:8px 12px}
.date b{font-size:20px;display:block}.date small{color:var(--quiet)}
.block.wl{background:transparent!important;border:2px dashed currentColor}
.mine{display:inline-flex;gap:4px;margin-top:4px}
.mine button{white-space:nowrap;background:var(--panel);border:1px solid var(--line);color:var(--quiet);border-radius:999px;padding:2px 8px;font:600 11.5px inherit;cursor:pointer}
.mine button.on{background:#1f2a3d;border-color:var(--blue);color:var(--blue)}
.chip.blue{background:#1f2a3d;color:var(--blue)}
.chip.grey{background:var(--panel2);color:var(--soft)}
.warn{color:var(--amber);font-size:13.5px;margin-top:6px}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:760px){.fgrid{grid-template-columns:1fr}}
.result{border-top:1px solid var(--line);padding:10px 0}
.result:first-child{border-top:0}
.result .sec{display:flex;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--soft);margin-top:4px;align-items:baseline}
</style>
</head>
<body>
<div id="setup" hidden></div>
<header id="hdr">
  <div class="top">
    <div class="brand"><i></i>Seat Watcher</div>
    <div class="sub" id="sub">Loading</div>
    <div class="spacer"></div>
    <button class="btn alt" id="now">Check now</button>
    <button class="btn" id="reg">Open Athena</button>
  </div>
  <div class="tabs">
    <button class="tab on" data-tab="home">Home</button>
    <button class="tab" data-tab="seats">Seats</button>
    <button class="tab" data-tab="schedules">Schedules</button>
    <button class="tab" data-tab="finder">Finder</button>
    <button class="tab" data-tab="settings">Settings</button>
  </div>
</header>
<main id="main">
  <section id="home"></section>
  <section id="seats" hidden></section>
  <section id="schedules" hidden></section>
  <section id="finder" hidden></section>
  <section id="settings" hidden></section>
</main>
<div class="toast" id="toast"></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DAY = { M: 'Mon', T: 'Tue', W: 'Wed', R: 'Thu', F: 'Fri', S: 'Sat', U: 'Sun' };
const COLORS = ['#ffb4a2', '#a3d9ff', '#b9f3b0', '#ffe08a', '#d7b8ff', '#9ff0e0', '#ffc3e1', '#c9d4ff'];
let S = null; // last /api/state
let onlyFits = false;
let strict = true;

const clock = (t) => { if (!t) return 'Online'; const h = +t.slice(0, 2); return `${h % 12 || 12}:${t.slice(2)}${h < 12 ? 'am' : 'pm'}`; };
const when = (s) => (s.online || !s.begin ? 'Online' : s.meetings.map((m) => `${m.days} ${clock(m.begin)}`).join(' + '));
const ago = (iso) => { if (!iso) return 'never'; const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 1 ? 'just now' : m === 1 ? '1 minute ago' : m < 60 ? `${m} minutes ago` : `${Math.round(m / 60)}h ago`; };
const toast = (t) => { const el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => (el.style.display = 'none'), 2200); };
const copy = async (t, what) => { try { await navigator.clipboard.writeText(t); toast(`Copied ${what}`); } catch { toast(t); } };

function rmp(name) {
  if (!name) return '';
  const first = name.split(',')[0].trim();
  const id = S.config.school.rmp_school_id;
  const url = id ? `https://www.ratemyprofessors.com/search/professors/${encodeURIComponent(id)}?q=${encodeURIComponent(first)}` : `https://www.ratemyprofessors.com/search/professors?q=${encodeURIComponent(first)}`;
  return `<a href="${url}" target="_blank" rel="noopener" title="Look up on Rate My Professors">${esc(name)} ↗</a>`;
}

async function load() {
  S = await (await fetch('/api/state')).json();
  if (S.needs_setup) { if ($('#setup').hidden) startSetup(); return; }
  $('#setup').hidden = true; $('#hdr').hidden = false; $('#main').hidden = false;
  const st = S.status;
  const term = S.config.term_name || S.config.term;
  $('#sub').textContent = `${term} · ${st.checking ? 'checking now' : `checked ${ago(st.last_check_at)}`}${st.last_error ? ` · problem: ${st.last_error}` : ''}`;
  renderSeats();
  if (!$('#home').hidden) renderHome();
  if (!$('#settings').hidden && !$('#settings').dataset.ready) renderSettings();
}

// ---------- rule presets: one click on, one click off. None are on until you pick them. ----------
const PRESETS = [
  { label: 'No 8ams', on: (r) => !!r.earliest && r.earliest >= '09:00', set: (r, v) => (r.earliest = v ? '09:00' : '') },
  { label: 'No Fridays', on: (r) => r.skip_days.includes('F'), set: (r, v) => (r.skip_days = r.skip_days.replace('F', '') + (v ? 'F' : '')) },
  { label: 'Done by 5pm', on: (r) => !!r.latest && r.latest <= '17:00', set: (r, v) => (r.latest = v ? '17:00' : '') },
  { label: 'No evening classes', on: (r) => !!r.latest && r.latest <= '18:00' && r.latest > '17:00', set: (r, v) => (r.latest = v ? '18:00' : '') },
  { label: 'No online', on: (r) => r.allow_online === false, set: (r, v) => (r.allow_online = !v) },
  { label: 'Prefer Mon/Wed', on: (r) => r.preferred_days === 'MW', set: (r, v) => (r.preferred_days = v ? 'MW' : '') },
  { label: 'Prefer Tue/Thu', on: (r) => r.preferred_days === 'TR', set: (r, v) => (r.preferred_days = v ? 'TR' : '') },
];
const presetBar = (rules, attr = 'data-preset') => `<div class="presets">${PRESETS.map((p, i) => `<span class="preset ${p.on(rules) ? 'on' : ''}" ${attr}="${i}">${p.label}</span>`).join('')}</div>`;
function wirePresets() {
  document.querySelectorAll('[data-preset]').forEach((el) => (el.onclick = async () => {
    const cfg = structuredClone(S.config);
    const p = PRESETS[+el.dataset.preset];
    p.set(cfg.rules, !p.on(cfg.rules));
    await save(cfg, `${p.label} ${p.on(cfg.rules) ? 'on' : 'off'}`);
    if (!$('#settings').hidden) { delete $('#settings').dataset.ready; renderSettings(); }
  }));
}

async function setHeld(course, patch, msg) {
  const r = await fetch('/api/held', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ course, ...patch }) });
  const d = await r.json();
  if (!r.ok) return toast(d.error);
  toast(msg);
  await load();
}

// ---------- home: your week and what to do next ----------
async function renderHome() {
  const r = await (await fetch('/api/week')).json();
  const colors = Object.fromEntries(S.config.courses.map((c, i) => [c.course, COLORS[i % COLORS.length]]));
  const w = r.week;
  let html = '';
  if (r.dates.length) {
    html += `<div class="card"><h2>Coming up</h2><div class="datechips" style="margin-top:10px">${r.dates.map((d) => `<div class="date" title="${esc(d.tip)}"><b>${d.days_left === 0 ? 'Today' : d.days_left === 1 ? 'Tomorrow' : `${d.days_left} days`}</b><small>${esc(d.label)} · ${new Date(d.date + 'T12:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</small></div>`).join('')}</div><p class="note">${esc(r.dates[0].tip)}</p></div>`;
  }
  html += `<div class="card"><h2>What to do next</h2>`;
  if (!r.moves.length) html += `<p class="note">Nothing to do right now. ${w.picks.length ? "You're set unless something better opens; the watcher keeps checking." : ''}</p>`;
  for (const m of r.moves) {
    html += `<div class="move k${m.urgency}"><b>${esc(m.title)}</b><p>${esc(m.why)}</p>${m.steps.length ? `<ol>${m.steps.map((s) => `<li>${esc(s)}</li>`).join('')}</ol>` : ''}${m.crns.length ? `<p class="note"><button class="btn alt" data-copy="${m.crns.join(', ')}">Copy CRN${m.crns.length > 1 ? 's' : ''}</button>&nbsp; Then open Athena's Enter CRNs tab.</p>` : ''}</div>`;
  }
  html += `</div>`;
  html += `<div class="card"><h2>Your week <small>${esc(w.summary || 'Mark the sections you have on the Seats tab (or sync from Athena with the Chrome extension).')}</small></h2>`;
  if (w.picks.length) html += grid(w.picks, colors);
  for (const x of w.walks) html += `<p class="warn">${DAY[x.day]}: ${esc(x.from.course)} (${esc(x.from.building)}) to ${esc(x.to.course)} (${esc(x.to.building)}) is about a ${x.walk} minute walk with ${x.gap} minutes between. ${x.level === 'too far' ? "You likely won't make it on time." : 'Tight.'}</p>`;
  if (w.picks.some((p) => p.waitlisted)) html += `<p class="note">Dashed means you're on the waitlist, not registered yet.</p>`;
  if (w.online.length) html += `<p class="note">Online: ${w.online.map((p) => `${esc(p.course)} (CRN ${p.sections[0].crn})`).join(', ')}</p>`;
  for (const n of w.notes) html += `<p class="warn">${esc(n)}</p>`;
  html += `</div>`;
  html += `<div class="card"><h2>Your rules <small>one click to turn on or off</small></h2><div style="margin-top:10px">${presetBar(S.config.rules)}</div></div>`;
  const ev = S.status.events;
  if (ev.length) html += `<div class="card"><h2>Recent alerts</h2>${ev.slice(0, 5).map((e) => `<div class="event"><b>${esc(e.title)}</b><span>${esc(e.body)} · ${ago(e.at)}</span></div>`).join('')}</div>`;
  $('#home').innerHTML = html;
  document.querySelectorAll('#home [data-copy]').forEach((el) => (el.onclick = () => copy(el.dataset.copy, 'CRN')));
  wirePresets();
}

function renderSeats() {
  const st = S.status;
  const courseCfg = Object.fromEntries(S.config.courses.map((c) => [c.course, c]));
  let html = '';
  if (!S.config.courses.length) html += `<div class="banner">No courses yet. Add some in Settings.</div>`;
  html += `<div class="card"><h2>Your rules <small>one click to turn on or off</small></h2><div style="margin-top:10px">${presetBar(S.config.rules)}</div></div>`;
  html += `<div class="toolbar"><label class="check"><input type="checkbox" id="onlyFits" ${onlyFits ? 'checked' : ''}> Only show sections that fit my rules</label><span class="note">Bright = seats open · faded = full · <span style="color:var(--green)">green edge</span> fits your rules · <span style="color:var(--amber)">amber edge</span> doesn't · click a CRN to copy it</span></div>`;
  for (const c of st.courses) {
    const cfg = courseCfg[c.course] ?? {};
    if (!c.ok) { html += `<div class="card"><h2>${esc(c.course)}</h2><p class="note">Couldn't check: ${esc(c.error)}</p></div>`; continue; }
    const secs = [...c.sections].sort((a, b) => (b.seats > 0) - (a.seats > 0) || (b.fits - a.fits) || String(a.begin ?? '9999').localeCompare(String(b.begin ?? '9999')));
    const open = secs.filter((s) => s.seats > 0);
    const fitOpen = open.filter((s) => s.fits);
    const title = secs[0]?.title ?? '';
    let backup = '';
    if (!c.targeted && !cfg.registered && !cfg.waitlisted && secs.length && !fitOpen.length) {
      backup = open.length
        ? `<div class="banner">Nothing that fits your rules has a seat. Best backups: ${open.slice(0, 2).map((s) => `${when(s)} (CRN ${s.crn}, ${s.seats} open)`).join(' or ')}. A seat beats no seat; the watcher tells you if something better opens.</div>`
        : `<div class="banner">Every section is full. Join a waitlist in Athena if there is one.</div>`;
    }
    const targetsNote = c.targeted ? `<p class="note">Switch mode: only alerting for CRN ${cfg.targets.join(', ')}. Tap ☆ to change.</p>` : `<p class="note">Mark the section you're in (or waitlisted for) and Home tells you what to do next. Star (☆) sections you'd switch to and it only alerts for those.</p>`;
    const alertsBtn = `<button class="btn alt" style="padding:4px 12px;font-size:12.5px" data-alerts="${esc(c.course)}" data-on="${c.alerts !== false ? 1 : 0}">${c.alerts !== false ? 'Alerts on' : 'Alerts off'}</button>`;
    html += `<div class="card"><h2>${esc(c.course)} <small>${esc(title)} · ${open.length} of ${secs.length} sections have seats · ${fitOpen.length} fit your rules</small><span class="spacer"></span>${alertsBtn}</h2>${targetsNote}${backup}`;
    for (const s of secs) {
      if (onlyFits && !s.fits) continue;
      const isTarget = (cfg.targets ?? []).includes(s.crn);
      const chips = s.fits ? [`<span class="chip ok">${c.targeted ? 'switch target' : 'fits'}</span>`] : s.why.map((w) => `<span class="chip">${esc(w)}</span>`);
      if (s.yours) chips.unshift(`<span class="chip blue">${s.yours === 'registered' ? "You're in this one" : "You're on its waitlist"}</span>`);
      if (s.odds && s.yours !== 'registered') chips.push(`<span class="chip ${s.odds.level === 'likely' ? 'ok' : ''}" title="Athena holds every open seat for the waitlist while anyone is on it">${esc(s.odds.text)}</span>`);
      if (s.reopened_at) chips.push(`<span class="chip grey" title="Opened ${s.opens} time${s.opens === 1 ? '' : 's'} since watching started">Reopened ${esc(when2(s.reopened_at))}</span>`);
      const mine = `<div class="mine"><button class="${s.yours === 'registered' ? 'on' : ''}" data-held="registered" data-course="${esc(c.course)}" data-crn2="${s.crn}">I'm in this</button><button class="${s.yours === 'waitlisted' ? 'on' : ''}" data-held="waitlisted" data-course="${esc(c.course)}" data-crn2="${s.crn}">Waitlisted</button></div>`;
      html += `<div class="row ${s.seats > 0 || s.yours ? '' : 'full'} ${s.fits ? 'fit' : 'nofit'}">
        <div><div class="when">${esc(when(s))}</div><div class="chips">${chips.join('')}</div>${mine}</div>

        <div class="seats ${s.seats > 0 ? 'open' : 'none'}">${s.seats > 0 ? `${s.seats} open` : 'Full'}<small>of ${s.max}${s.raw_seats > s.seats ? `, ${s.raw_seats} held for the waitlist` : ''}</small></div>

    }

  }
  $('#seats').innerHTML = html;
  $('#onlyFits').onchange = (e) => { onlyFits = e.target.checked; renderSeats(); };
  document.querySelectorAll('[data-crn]').forEach((el) => (el.onclick = () => copy(el.dataset.crn, `CRN ${el.dataset.crn}`)));
  document.querySelectorAll('[data-star]').forEach((el) => (el.onclick = () => toggleTarget(el.dataset.course, el.dataset.star)));
  document.querySelectorAll('[data-held]').forEach((el) => (el.onclick = () => {
    const kind = el.dataset.held, course = el.dataset.course, crn = el.dataset.crn2;
    const off = el.classList.contains('on');
    setHeld(course, { [kind]: off ? '' : crn, ...(off ? {} : { [kind === 'registered' ? 'waitlisted' : 'registered']: '' }) }, off ? `${course}: cleared` : `${course}: ${kind === 'registered' ? "you're in" : "you're waitlisted for"} ${crn}`);
  }));
  document.querySelectorAll('[data-alerts]').forEach((el) => (el.onclick = () => setHeld(el.dataset.alerts, { enabled: el.dataset.on !== '1' }, `${el.dataset.alerts}: alerts ${el.dataset.on === '1' ? 'off' : 'on'}`)));
  wirePresets();
}

/** 'Tue 3:42pm' for this week, 'Nov 12' for older. */
function when2(iso) {
  const d = new Date(iso);
  const days = (Date.now() - d) / 86400000;
  if (days < 6) return d.toLocaleDateString(undefined, { weekday: 'short' }) + ' ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }).replace(' ', '').toLowerCase();
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

async function toggleTarget(course, crn) {
  const cfg = structuredClone(S.config);
  const c = cfg.courses.find((x) => x.course === course);
  c.targets = c.targets ?? [];
  c.targets = c.targets.includes(crn) ? c.targets.filter((t) => t !== crn) : [...c.targets, crn];
  await save(cfg, c.targets.length ? `Watching ${c.targets.length} switch target${c.targets.length > 1 ? 's' : ''} for ${course}` : `${course} back to normal watching`);
}

async function save(cfg, msg) {
  const r = await fetch('/api/config', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cfg) });
  const d = await r.json();
  if (!r.ok) { toast(d.error); return false; }
  toast(msg || 'Saved');
  await load();
  return true;
}

      .join('')}</div><p class="note"><button class="btn alt" data-copy="${crns}">Copy CRNs</button>&nbsp; Paste into Athena's "Enter CRNs" tab.</p></div>`;

function grid(picks, colors) {
  const all = picks.flatMap((p) => p.meetings);
  const mins = (t) => +t.slice(0, 2) * 60 + +t.slice(2);
  const start = Math.min(8 * 60, ...all.map((m) => Math.floor(mins(m.begin) / 60) * 60));
  const end = Math.max(17 * 60, ...all.map((m) => Math.ceil(mins(m.end) / 60) * 60));
  const px = 0.7, height = (end - start) * px;
  const days = ['M', 'T', 'W', 'R', 'F'];
  let h = `<div class="grid"><div class="h"></div>${days.map((d) => `<div class="h">${DAY[d]}</div>`).join('')}`;
  h += `<div class="hours" style="height:${height}px">`;
  for (let t = start; t < end; t += 60) h += `<div class="hr" style="top:${(t - start) * px}px">${((t / 60) % 12) || 12}${t < 720 ? 'a' : 'p'}</div>`;
  h += `</div>`;
  for (const d of days) {
    h += `<div class="col" style="height:${height}px">`;
    for (let t = start; t < end; t += 60) h += `<div class="hr" style="top:${(t - start) * px}px"></div>`;
    for (const p of picks) for (const m of p.meetings) if (m.days.includes(d)) {
      h += `<div class="block ${p.waitlisted ? 'wl' : ''}" style="top:${(mins(m.begin) - start) * px}px;height:${(mins(m.end) - mins(m.begin)) * px}px;background:${colors[p.course]};color:${p.waitlisted ? colors[p.course] : '#0d0f12'}">${esc(p.course)}<span>${clock(m.begin)}${p.waitlisted ? ' · waitlisted' : ''}</span></div>`;
    }
    h += `</div>`;
  }
  return h + `</div>`;
}

async function search() {
  const q = new URLSearchParams({ min: F.min, max: F.grad ? '' : '5999', credits: F.credits, format: F.format, open: F.open ? '1' : '0', around_week: F.around ? '1' : '0', fits_rules: F.fits ? '1' : '0', days: F.days, after: F.after, before: F.before, exclude: F.exclude.toUpperCase().replace(/\s+/g, ''), subjects: F.subjects.toUpperCase().replace(/\s+/g, ''), text: F.text, limit: '60' });
  $('#f_out').innerHTML = `<p class="note">Searching...</p>`;
  const r = await fetch('/api/finder?' + q);
  const d = await r.json();
  if (r.status === 202) {
    $('#f_out').innerHTML = `<div class="card"><p class="note">First search of the day: downloading every section of the term from Athena, slowly so it doesn't strain it. About a minute${d.progress?.total ? ` (${d.progress.done} of ${d.progress.total})` : ''}.</p></div>`;

  let html = `<p class="note">${d.courses.length ? `${d.total} sections in ${d.shown < d.courses.length ? `${d.shown}+` : d.courses.length} courses` : 'Nothing matches. Loosen a filter or two.'} · class list from ${ago(d.at)} · <a href="#" id="f_refresh">refresh</a></p>`;
  html += `<div class="card">${d.courses.map((c) => `<div class="result"><b>${esc(c.course)}</b> <span class="sub">${esc(c.title)} · ${esc(c.credits ?? '')} hrs</span> <button class="btn alt" style="padding:3px 10px;font-size:12.5px;margin-left:6px" data-watch="${esc(c.course)}">Watch</button>
    ${c.sections.slice(0, 4).map((s) => `<div class="sec"><span class="when">${esc(s.remote ? 'Online' : s.begin ? when(s) : 'Time TBA')}</span><span class="crn" data-crn="${s.crn}">CRN ${s.crn}</span><span style="color:${s.seats > 0 ? 'var(--green)' : 'var(--quiet)'}">${s.seats > 0 ? `${s.seats} open` : s.waiting ? `${s.waiting} waiting` : 'Full'}</span><span class="who">${rmp(s.instructor)}</span>${s.meetings[0]?.building && !s.remote ? `<span class="note" style="margin:0">${esc(s.meetings[0].building)}</span>` : ''}</div>`).join('')}
    ${c.sections.length > 4 ? `<div class="note">${c.sections.length - 4} more sections</div>` : ''}</div>`).join('')}</div>`;
  $('#f_out').innerHTML = html;

}

const W = { step: 0, term: null, termName: '', terms: [], courses: [], rules: { earliest: '', latest: '', skip_days: '', preferred_days: '', allow_online: true }, more: false, phone: true, ntfy: '', discord: '', autostart: true, error: '' };
const TIMES = ['', '08:00', '08:30', '09:00', '09:30', '10:00', '10:30', '11:00', '12:00'];
const ENDS = ['', '14:00', '15:00', '16:00', '16:30', '17:00', '17:30', '18:00', '19:00'];
const nice = (t) => (t ? clock(t.replace(':', '')) : 'Any time');
const topic = () => 'seats-' + crypto.getRandomValues(new Uint8Array(6)).reduce((s, b) => s + b.toString(16).padStart(2, '0'), '');

async function startSetup() {
  $('#hdr').hidden = true; $('#main').hidden = true; $('#setup').hidden = false;
  W.ntfy = topic();
  drawSetup();
  try { W.terms = await (await fetch('/api/terms')).json(); } catch { W.error = "Couldn't reach Athena. Check your internet, then reload this page."; }
  W.term = W.terms[0]?.code; W.termName = W.terms[0]?.description ?? '';
  // Default to the next regular term (usually the one being registered for), not summer.
  const reg = W.terms.find((t) => !/summer/i.test(t.description)); if (reg) { W.term = reg.code; W.termName = reg.description; }
  drawSetup();
}

function dayChips(key) {
  return `<div class="days">${['M', 'T', 'W', 'R', 'F'].map((d) => `<span class="day ${W.rules[key].includes(d) ? 'on' : ''}" data-dk="${key}" data-d="${d}">${DAY[d]}</span>`).join('')}</div>`;
}

function drawSetup() {
  const n = 5;
  const bar = `<div class="steps">${Array.from({ length: n }, (_, i) => `<i class="${i <= W.step ? 'on' : ''}"></i>`).join('')}</div>`;
  let body = '';
  const err = W.error ? `<p class="err">${esc(W.error)}</p>` : '';
  if (W.step === 0) {
    body = `<h1>Seat Watcher</h1><p class="lead">Tells you when a seat opens in a class that fits your schedule, and builds possible schedules from what's open. No UGA login needed. Takes about 2 minutes.</p>
      ${S.mac_folder_warning ? `<div class="banner">Heads up: this folder is in ${esc(S.mac_folder_warning)}. macOS blocks background apps from reading that folder, so it would stop working after a restart. Move the uga-seat-watcher folder into your home folder (Finder > Go > Home) and open it from there.</div>` : ''}
      <div class="card"><h2>Which term?</h2><div style="margin-top:10px">${W.terms.length ? W.terms.map((t) => `<label class="opt ${t.code === W.term ? 'on' : ''}" data-term="${t.code}">${esc(t.description)}</label>`).join('') : '<p class="note">Loading terms from Athena...</p>'}</div></div>`;
  } else if (W.step === 1) {
    body = `<h1>Your courses</h1><p class="lead">Add each course you need, like BUSN 4000. It checks Athena as you go.</p>
      <div class="card"><div style="display:flex;gap:8px"><input type="text" id="wc" placeholder="BUSN 4000" autofocus><button class="btn" id="wadd" type="button">Add</button></div>${err}
      ${W.courses.map((c, i) => `<div class="added"><div><b>${esc(c.course)}</b> <small>${esc(c.title)}</small><br><small>${c.sections} sections, ${c.open} with open seats</small></div><button class="btn alt" data-wrm="${i}" type="button">Remove</button></div>`).join('') || '<p class="note">None yet.</p>'}
      <p class="note">Already registered for some? Add them too, then mark your section on the Seats tab, so it can plan around your week.</p></div>`;
  } else if (W.step === 2) {
    body = `<h1>Your rules</h1><p class="lead">Pick any that matter to you, or none. Sections outside your rules still show up; they just won't alert you or go in suggested schedules. One click turns each off again later.</p>
      <div class="card">${presetBar(W.rules, 'data-wpreset')}<p class="note"><a href="#" id="wmore">${W.more ? 'Hide' : 'More'} options</a></p></div>
      <div class="card" ${W.more ? '' : 'hidden'}><div class="two">
        <div class="field"><label class="l">Earliest a class can start</label><select id="we">${TIMES.map((t) => `<option value="${t}" ${t === W.rules.earliest ? 'selected' : ''}>${t ? nice(t) : 'Any time'}</option>`).join('')}</select></div>
        <div class="field"><label class="l">Latest a class can end</label><select id="wl">${ENDS.map((t) => `<option value="${t}" ${t === W.rules.latest ? 'selected' : ''}>${t ? nice(t) : 'Any time'}</option>`).join('')}</select></div>
      </div>
      <div class="field" style="margin-top:14px"><label class="l">Days to skip</label>${dayChips('skip_days')}</div>
      <div class="field"><label class="l">Days you prefer</label>${dayChips('preferred_days')}<div class="hint">Schedules on these days rank higher.</div></div>
      <label class="check"><input type="checkbox" id="wo" ${W.rules.allow_online ? 'checked' : ''}> Count online sections</label></div>`;
  } else if (W.step === 3) {
    const deskName = S.platform === 'darwin' ? 'Mac' : 'computer';
    body = `<h1>Alerts</h1><p class="lead">You'll always get a pop-up on this ${deskName}. Want them on your phone too?</p>
      <div class="card"><label class="check"><input type="checkbox" id="wp" ${W.phone ? 'checked' : ''}> Send alerts to my phone (free ntfy app, no account)</label>
      ${W.phone ? `<ol class="note" style="font-size:14px;line-height:1.7"><li>Install <b>ntfy</b> from the App Store or Google Play.</li><li>Tap <b>+</b> and subscribe to this topic:<br><span class="big">${esc(W.ntfy)}</span></li><li>Keep it to yourself. Anyone who knows it can see your alerts.</li></ol>` : ''}
      <div class="field" style="margin-top:12px"><label class="l">Discord webhook (optional)</label><input type="text" id="wd" value="${esc(W.discord)}" placeholder="https://discord.com/api/webhooks/..."></div>
      <button class="btn alt" id="wtest" type="button">Send a test alert</button>${err}</div>`;
  } else if (W.step === 4) {
    const can = S.platform === 'win32' || S.platform === 'darwin';
    body = `<h1>Ready</h1><p class="lead">Watching ${W.courses.map((c) => c.course).join(', ')} for ${esc(W.termName)}, every 3 minutes.</p>
      <div class="card">${can ? `<label class="check"><input type="checkbox" id="wa" ${W.autostart ? 'checked' : ''}> Run in the background and start whenever I log in</label><p class="note">Recommended. Otherwise it only runs while the Seat Watcher window stays open.</p>` : `<p class="note">Keep the Seat Watcher window open while you want it watching.</p>`}${err}</div>`;
  } else if (W.step === 5) {
    body = `<h1>All set</h1><p class="lead">${esc(W.done || '')}</p><p class="note">Opening your dashboard...</p>`;
  }
  const nav = W.step < 5 ? `<div class="nav">${W.step ? '<button class="btn alt" id="wback" type="button">Back</button>' : '<span></span>'}<button class="btn" id="wnext" type="button">${W.step === 4 ? 'Start watching' : 'Next'}</button></div>` : '';
  $('#setup').innerHTML = `<div class="wiz">${bar}${body}${nav}</div>`;
  wireSetup();
}

function wireSetup() {
  document.querySelectorAll('[data-term]').forEach((el) => (el.onclick = () => { W.term = el.dataset.term; W.termName = el.textContent; drawSetup(); }));
  document.querySelectorAll('[data-wrm]').forEach((el) => (el.onclick = () => { W.courses.splice(+el.dataset.wrm, 1); drawSetup(); }));
  document.querySelectorAll('[data-dk]').forEach((el) => (el.onclick = () => {
    const k = el.dataset.dk, d = el.dataset.d;
    W.rules[k] = W.rules[k].includes(d) ? W.rules[k].replace(d, '') : W.rules[k] + d;
    el.classList.toggle('on');
  }));
  const add = async () => {
    const v = $('#wc').value.trim(); if (!v) return;
    W.error = '';
    $('#wadd').disabled = true; $('#wadd').textContent = 'Checking...';
    const r = await fetch(`/api/course?name=${encodeURIComponent(v)}&term=${W.term}`);
    const d = await r.json();
    if (!r.ok) W.error = d.error;
    else if (!d.sections) W.error = `${d.course} has no sections in ${W.termName}.`;
    else if (W.courses.some((c) => c.course === d.course)) W.error = `${d.course} is already on the list.`;
    else W.courses.push(d);
    drawSetup();
    $('#wc')?.focus();
  };
  if ($('#wadd')) { $('#wadd').onclick = add; $('#wc').onkeydown = (e) => { if (e.key === 'Enter') add(); }; }
  if ($('#we')) { $('#we').onchange = (e) => (W.rules.earliest = e.target.value); $('#wl').onchange = (e) => (W.rules.latest = e.target.value); $('#wo').onchange = (e) => (W.rules.allow_online = e.target.checked); }
  document.querySelectorAll('[data-wpreset]').forEach((el) => (el.onclick = () => { const p = PRESETS[+el.dataset.wpreset]; p.set(W.rules, !p.on(W.rules)); drawSetup(); }));
  if ($('#wmore')) $('#wmore').onclick = (e) => { e.preventDefault(); W.more = !W.more; drawSetup(); };
  if ($('#wp')) { $('#wp').onchange = (e) => { W.phone = e.target.checked; drawSetup(); }; $('#wd').oninput = (e) => (W.discord = e.target.value.trim()); }
  if ($('#wtest')) $('#wtest').onclick = async () => {
    const r = await (await fetch('/api/test-alert', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ alerts: alertsNow() }) })).json();
    toast(r.ok ? 'Sent. Check your screen' + (W.phone ? ' and phone.' : '.') : r.problems.join('; '));
  };
  if ($('#wa')) $('#wa').onchange = (e) => (W.autostart = e.target.checked);
  if ($('#wback')) $('#wback').onclick = () => { W.error = ''; W.step--; drawSetup(); };
  if ($('#wnext')) $('#wnext').onclick = next;
}

const alertsNow = () => ({ desktop: true, ntfy_topic: W.phone ? W.ntfy : '', discord_webhook: W.discord });

async function next() {
  W.error = '';
  if (W.step === 0 && !W.term) return;
  if (W.step === 1 && !W.courses.length) { W.error = 'Add at least one course.'; return drawSetup(); }
  if (W.step < 4) { W.step++; return drawSetup(); }
  $('#wnext').disabled = true; $('#wnext').textContent = 'Starting...';
  const config = { term: W.term, term_name: W.termName, every_minutes: 3, rules: { ...W.rules, avoid_times: [] }, courses: W.courses.map((c) => ({ course: c.course, enabled: true, targets: [] })), alerts: alertsNow() };
  const r = await fetch('/api/setup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ config, autostart: W.autostart }) });
  const d = await r.json();
  if (!r.ok) { W.error = d.error; return drawSetup(); }
  W.done = d.message; W.step = 5; drawSetup();
  // Wait for the watcher (this one, or the background copy taking over) to answer, then show the dashboard.
  for (let i = 0; i < 60; i++) {
    await new Promise((res) => setTimeout(res, 2000));
    try { const st = await (await fetch('/api/state')).json(); if (!st.needs_setup && st.status.last_check_at) { location.hash = ''; return load(); } } catch {}
  }
  load();
}

document.querySelectorAll('.tab').forEach((t) => (t.onclick = () => showTab(t)));
$('#now').onclick = async () => { $('#now').disabled = true; $('#sub').textContent = 'Checking now...'; await fetch('/api/check', { method: 'POST' }); $('#now').disabled = false; await load(); if (!$('#schedules').hidden) renderSchedules(); };
$('#reg').onclick = () => window.open(S?.config.school.register_url || 'https://athena.uga.edu', '_blank');
load().then(() => {
  if (S.needs_setup) return;
  const t = document.querySelector(`.tab[data-tab="${location.hash.slice(1)}"]`) || document.querySelector('.tab[data-tab="home"]');
  showTab(t);
});
setInterval(() => { if ($('#settings').hidden && $('#finder').hidden && $('#setup').hidden) load(); }, 20000);
</script>
</body>
</html>
